name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create a Release on tag pushes

env:
  # blpapi is published on Bloomberg's own index, not PyPI.
  BLPAPI_INDEX: https://blpapi.bloomberg.com/repository/releases/python/simple/

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps (blpapi is stubbed by tests/conftest.py)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 "uvicorn[standard]==0.32.0" \
            pydantic==2.9.2 pydantic-settings==2.5.2 python-dotenv==1.0.1 \
            pytest==8.3.3 httpx==0.27.2
      - run: pytest -q

  build:
    needs: test
    # Only build the (slow) Windows exe for releases or manual runs.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps (incl. blpapi from Bloomberg's index)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url=$env:BLPAPI_INDEX -r requirements-dev.txt

      - name: Build executable
        run: pyinstaller --clean --noconfirm data_bridge.spec

      - name: Sign executable (skips automatically if no secrets are set)
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          SIGN_THUMBPRINT: ${{ secrets.SIGN_THUMBPRINT }}
          SIGN_TIMESTAMP_URL: ${{ secrets.SIGN_TIMESTAMP_URL }}
        run: powershell -ExecutionPolicy Bypass -File scripts/sign.ps1 -Path dist/BloombergBridge.exe

      - name: Compute SHA256 checksum
        run: |
          $hash = (Get-FileHash dist/BloombergBridge.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  BloombergBridge.exe" | Out-File -Encoding ascii dist/BloombergBridge.exe.sha256
          Write-Host "SHA256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloombergBridge
          path: |
            dist/BloombergBridge.exe
            dist/BloombergBridge.exe.sha256

      - name: Publish release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create ${{ github.ref_name }}
          dist/BloombergBridge.exe dist/BloombergBridge.exe.sha256
          --title ${{ github.ref_name }} --generate-notes
